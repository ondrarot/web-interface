<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Automatic Speech Evaluation</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .upload-area {
            border: 2px dashed #011e3d;
            border-radius: 8px;
            padding: 2rem;
            margin: 1.5rem 0;
            background-color: rgba(255, 255, 255, 0.1);
            transition: background-color 0.3s ease;
            cursor: pointer;
        }

        .upload-area:hover {
            background-color: rgba(255, 255, 255, 0.2);
        }

        #audio-preview {
            width: 100%;
            margin-top: 1rem;
            display: none;
        }

        .result-card {
            background-color: #011e3d;
            color: #ffffff;
            padding: 1.5rem;
            border-radius: 8px;
            margin-top: 1.5rem;
            display: none;
            animation: fadeIn 0.5s ease;
        }

        .result-card h2 {
            margin: 0;
            font-size: 1.2rem;
        }

        .mos-score {
            font-size: 3rem;
            font-weight: bold;
            margin: 0.5rem 0;
            color: #ffcc00;
        }

        .loading-spinner {
            display: none;
            margin: 1.5rem auto;
            border: 4px solid rgba(0, 0, 0, 0.1);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border-left-color: #011e3d;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .error-message {
            color: #ff4d4d;
            background-color: rgba(255, 77, 77, 0.1);
            padding: 0.5rem;
            border-radius: 4px;
            margin-top: 1rem;
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🎤 Automatic Speech Evaluation</h1>
            <p>Upload a .wav recording to get an automatic Mean Opinion Score (MOS) using the UTMOSv2 model.</p>
        </header>

        <section class="app-content">
            <div class="upload-area" id="drop-zone">
                <p>Click or drag & drop a <b>.wav</b> file here</p>
                <input type="file" id="file-input" accept=".wav" style="display: none;">
            </div>

            <audio id="audio-preview" controls></audio>

            <button id="evaluate-btn" class="button" style="width: 100%; margin-top: 1rem;" disabled>Evaluate Audio</button>

            <div class="loading-spinner" id="loader"></div>
            <p id="processing-text" style="display: none; color: #011e3d;">Analyzing audio quality...</p>

            <div class="result-card" id="result-card">
                <h2>Predicted MOS Score:</h2>
                <div class="mos-score" id="mos-score">0.00</div>
                <p>/ 5.00</p>
            </div>

            <div class="error-message" id="error-msg"></div>
        </section>

        <footer>
            <a href="../index.html" class="back-link">Back to Homepage</a>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
